name: Push Notifications

# 每 5 分鐘檢查一次，有快開始的工作就推播到手機（App 關掉也收得到）
# GitHub 排程常常會晚幾分鐘，偶爾晚 10 分鐘以上
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Find web folder
        run: |
          if [ -f web/push/send.js ]; then
            echo "WEB_DIR=$PWD/web" >> "$GITHUB_ENV"
          else
            Z=$(ls *.zip | head -1)
            unzip -q "$Z" -d src
            F=$(find src -path "*web/push/send.js" | head -1)
            if [ -z "$F" ]; then echo "::error::找不到 web/push/send.js，請上傳新版 PlanFlow.zip"; exit 1; fi
            echo "WEB_DIR=$PWD/$(dirname "$(dirname "$F")")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send push notifications
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd "$WEB_DIR/push"
          npm install --no-audit --no-fund --loglevel=error
          node send.js
